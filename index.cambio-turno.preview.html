<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Portal Interno CEEZ - Capacitaciones y Licencias</title>
  <link rel="icon" type="image/png" href="assets/pino-ceez.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css?v=2.2" rel="stylesheet">
</head>
<body>
  <!-- Continúa el portal existente; el marcado siguiente se incluye como fragmento reutilizable. -->
  <div id="panelCambioTurno" class="p-3 bg-info-subtle border border-info rounded-3 mb-3 d-none">
    <h6 class="fw-bold text-primary mb-2">Cambio de Turno / Franco</h6>
    <div class="mb-2">
      <label for="cambioTurnoCompanero" class="form-label fw-semibold small">Compañero/a del mismo sector</label>
      <select id="cambioTurnoCompanero" class="form-select form-select-sm">
        <option value="">Seleccione un compañero/a...</option>
      </select>
    </div>
    <div class="mb-2">
      <label for="horarioCambioTurno" class="form-label fw-semibold small">Turno, horario o franco a intercambiar</label>
      <textarea id="horarioCambioTurno" class="form-control form-control-sm" rows="2" placeholder="Ej.: Mañana 06 a 14 por tarde 14 a 22; Franco del 15/06..."></textarea>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js?v=2.2"></script>
</body>
</html>
