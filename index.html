<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Capacitaciones CEEZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #10b981;
      --success-hover: #059669;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: #ffffff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-badge { background-color: var(--primary); color: white; font-weight: 800; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; }
    .logo-text { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .user-info { font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); background-color: var(--bg-main); padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border-color); }

    main { flex: 1; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; }
    .card { background-color: var(--bg-card); border-radius: var(--radius); padding: 36px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); width: 100%; max-width: 440px; }
    .card-wide { max-width: 960px; }
    h2 { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 24px; text-align: center; }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); }
    input[type="email"], input[type="text"] { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); background-color: #ffffff; color: var(--text-primary); font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

    .btn { width: 100%; padding: 12px 20px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 0.925rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm); }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #ffffff; color: var(--text-secondary); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background-color: var(--bg-main); color: var(--text-primary); }
    .btn-success { background-color: var(--success); color: white; }
    .btn-success:hover { background-color: var(--success-hover); }
    .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }

    .error-msg { font-size: 0.875rem; font-weight: 500; text-align: center; margin-top: 16px; min-height: 20px; }

    .cap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 10px; }
    .cap-card { background-color: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-sm); }
    .cap-title { font-weight: 700; margin-bottom: 8px; color: var(--text-primary); font-size: 1.1rem; }
    .cap-desc { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 16px; word-break: break-word; }

    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 16px; }
    .badge-approved { background-color: var(--success-light); color: var(--success); }
    .badge-blocked { background-color: var(--danger-light); color: var(--danger); }
    .badge-pending { background-color: var(--warning-light); color: var(--warning); }

    .viewer-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: var(--radius); margin-bottom: 24px; }
    .viewer-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .pregunta-box { background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .opcion-item { margin: 10px 0; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; color: var(--text-primary); cursor: pointer; background-color: #ffffff; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); }
    .opcion-item:hover { border-color: var(--primary); background-color: var(--primary-light); }
    .opcion-item input { accent-color: var(--primary); width: 16px; height: 16px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-badge">CEEZ</div>
      <div class="logo-text">Portal de Capacitaciones</div>
    </div>
    <div class="user-info hidden" id="userInfoHeader"></div>
  </header>

  <main>
    <div id="loginSection" class="card">
      <h2>Iniciar Sesión</h2>
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" value="12@gmail.com" placeholder="ejemplo@correo.com">
      </div>
      <div class="form-group">
        <label for="dni">Número de DNI</label>
        <input type="text" id="dni" value="12123456" placeholder="Ingrese su DNI sin puntos">
      </div>
      <button class="btn" id="btnLogin" onclick="ejecutarLogin()">Ingresar a la Plataforma</button>
      <div class="error-msg" id="loginError"></div>
    </div>

    <div id="capacitacionesSection" class="card card-wide hidden">
      <h2>Capacitaciones Disponibles</h2>
      <div class="cap-grid" id="capContainer"></div>
    </div>

    <div id="materialSection" class="card card-wide hidden">
      <h2 id="materialTitulo">Material de Capacitación</h2>
      <div class="viewer-container" id="viewerBox"></div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-secondary" onclick="volverACapacitaciones()">Volver al Catálogo</button>
        <button class="btn" onclick="irAExamenDesdeMaterial()">Rendir Examen</button>
      </div>
    </div>

    <div id="examenSection" class="card card-wide hidden">
      <h2 id="examenTitulo">Examen de Evaluación</h2>
      <div id="loadingExamen" class="error-msg" style="color:var(--primary);">Cargando preguntas de la evaluación...</div>
      <div id="preguntasContainer"></div>

      <div style="display: flex; gap: 12px; margin-top: 20px;">
        <button class="btn btn-secondary" onclick="volverACapacitaciones()">Cancelar</button>
        <button class="btn hidden" id="btnEnviarExamen" onclick="evaluarRespostas()">Enviar Evaluación</button>
      </div>
      <div class="error-msg" id="examenError"></div>
    </div>
  </main>

  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwDkm0yZXWH8R6bDHeHR6DWe4WmOUixH_okjKncJkh57z3438NSAJgg7RZyG9G-vrcMoA/exec";

    let usuarioActual = { legajo: "", nombre: "", correo: "" };
    let capacitacionSeleccionada = null;
    let preguntasExamenActual = [];

    function pedirJSONP(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const script = document.createElement('script');

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Tiempo de espera agotado."));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error("Error de red."));
        };

        const queryParams = new URLSearchParams(params);
        queryParams.append('callback', callbackName);
        queryParams.append('_ts', Date.now());

        script.src = URL_WEB_APP + '?' + queryParams.toString();
        document.body.appendChild(script);
      });
    }

    async function ejecutarLogin() {
      const correo = document.getElementById("correo").value.trim();
      const dni = document.getElementById("dni").value.trim();
      const msgError = document.getElementById("loginError");
      const btn = document.getElementById("btnLogin");

      if (!correo || !dni) {
        msgError.style.color = "var(--danger)";
        msgError.innerText = "Por favor ingresa correo y DNI.";
        return;
      }

      msgError.style.color = "var(--primary)";
      msgError.innerText = "Verificando credenciales...";
      btn.disabled = true;

      try {
        const res = await pedirJSONP({ action: "login", correo: correo, dni: dni });

        if (res.success) {
          usuarioActual.legajo = res.legajo;
          usuarioActual.nombre = res.nombre;
          usuarioActual.correo = res.correo;
          
          const headerInfo = document.getElementById("userInfoHeader");
          headerInfo.innerText = `${res.nombre} (Legajo: ${res.legajo})`;
          headerInfo.classList.remove("hidden");

          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("capacitacionesSection").classList.remove("hidden");
          
          renderCapacitaciones(res.capacitaciones);
        } else {
          msgError.style.color = "var(--danger)";
          msgError.innerText = res.message || "Credenciales incorrectas.";
        }
      } catch (err) {
        msgError.style.color = "var(--danger)";
        msgError.innerText = "Error de conexión. Inténtalo de nuevo.";
      } finally {
        btn.disabled = false;
      }
    }

    function renderCapacitaciones(capacitaciones) {
      const container = document.getElementById("capContainer");
      container.innerHTML = "";

      if (!capacitaciones || capacitaciones.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-secondary);'>No hay capacitaciones activas.</p>";
        return;
      }

      capacitaciones.forEach(cap => {
        let badgeHtml = cap.aprobado 
          ? `<span class="badge badge-approved">✓ Aprobado</span>`
          : cap.bloqueado 
            ? `<span class="badge badge-blocked">Límite alcanzado hoy (3/3)</span>`
            : `<span class="badge badge-pending">Intentos hoy: ${cap.intentosHoy}/3</span>`;

        let certBtnHtml = (cap.aprobado && cap.urlCertificado) 
          ? `<a href="${cap.urlCertificado}" target="_blank" class="btn btn-success" style="margin-top:8px;">📄 Descargar Certificado</a>` 
          : "";

        // Si la URL viene dentro del texto de la descripción, la extraemos limpiamente
        let urlMaterial = cap.urlDrive || "";
        let descripcionLimpia = cap.descripcion || "";

        const matchUrl = descripcionLimpia.match(/https?:\/\/[^\s]+/);
        if (matchUrl) {
          if (!urlMaterial) urlMaterial = matchUrl[0];
          descripcionLimpia = descripcionLimpia.replace(matchUrl[0], "").trim();
        }

        const card = document.createElement("div");
        card.className = "cap-card";
        card.innerHTML = `
          <div>
            <div class="cap-title">${cap.titulo}</div>
            <div class="cap-desc">${descripcionLimpia}</div>
            ${badgeHtml}
          </div>
          <div style="margin-top:12px;">
            <button class="btn btn-secondary" onclick="verMaterial('${encodeURIComponent(cap.titulo)}', '${encodeURIComponent(urlMaterial)}')">Ver Contenido</button>
            <button class="btn" ${cap.bloqueado ? "disabled" : ""} style="margin-top:8px;" onclick="iniciarExamen('${encodeURIComponent(cap.titulo)}')">
              ${cap.aprobado ? "Rendir Nuevamente" : "Rendir Examen"}
            </button>
            ${certBtnHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function verMaterial(tituloEncoded, urlDriveEncoded) {
      const titulo = decodeURIComponent(tituloEncoded);
      let urlDrive = decodeURIComponent(urlDriveEncoded);
      
      capacitacionSeleccionada = { fileId: titulo, titulo: titulo };

      document.getElementById("capacitacionesSection").classList.add("hidden");
      document.getElementById("materialSection").classList.remove("hidden");
      document.getElementById("materialTitulo").innerText = titulo;

      const viewerBox = document.getElementById("viewerBox");

      if (!urlDrive || urlDrive === "undefined" || urlDrive.trim() === "") {
        viewerBox.innerHTML = `<div style="padding: 40px; text-align: center; color: white;">
          <h3>No hay un enlace configurado para esta capacitación.</h3>
        </div>`;
        return;
      }

      // Transformar URLs para visualización directa en visor iframe
      if (urlDrive.includes("drive.google.com")) {
        const match = urlDrive.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          urlDrive = `https://drive.google.com/file/d/${match[1]}/preview`;
        } else if (urlDrive.includes("/view")) {
          urlDrive = urlDrive.replace("/view", "/preview");
        }
      } else if (urlDrive.includes("youtube.com/watch?v=")) {
        urlDrive = urlDrive.replace("watch?v=", "embed/");
      } else if (urlDrive.includes("youtu.be/")) {
        urlDrive = urlDrive.replace("youtu.be/", "www.youtube.com/embed/");
      }

      viewerBox.innerHTML = `<iframe src="${urlDrive}" allowfullscreen allow="autoplay"></iframe>`;
    }

    function irAExamenDesdeMaterial() {
      document.getElementById("materialSection").classList.add("hidden");
      iniciarExamen(encodeURIComponent(capacitacionSeleccionada.titulo));
    }

    function volverACapacitaciones() {
      document.getElementById("materialSection").classList.add("hidden");
      document.getElementById("examenSection").classList.add("hidden");
      document.getElementById("capacitacionesSection").classList.remove("hidden");
      document.getElementById("viewerBox").innerHTML = "";
    }

    async function iniciarExamen(tituloEncoded) {
      const titulo = decodeURIComponent(tituloEncoded);
      capacitacionSeleccionada = { fileId: titulo, titulo: titulo };

      document.getElementById("capacitacionesSection").classList.add("hidden");
      document.getElementById("examenSection").classList.remove("hidden");
      document.getElementById("examenTitulo").innerText = "Evaluación: " + titulo;
      
      const loading = document.getElementById("loadingExamen");
      const preguntasBox = document.getElementById("preguntasContainer");
      const btnEnviar = document.getElementById("btnEnviarExamen");
      const errorMsg = document.getElementById("examenError");

      loading.classList.remove("hidden");
      preguntasBox.innerHTML = "";
      btnEnviar.classList.add("hidden");
      errorMsg.innerText = "";

      try {
        const res = await pedirJSONP({
          action: "generarExamen",
          titulo: titulo
        });

        if (res.success && res.preguntas) {
          preguntasExamenActual = res.preguntas;
          loading.classList.add("hidden");
          renderPreguntas(res.preguntas);
          btnEnviar.classList.remove("hidden");
        } else {
          loading.classList.add("hidden");
          errorMsg.style.color = "var(--danger)";
          errorMsg.innerText = res.message || "Error al obtener preguntas.";
        }
      } catch (err) {
        loading.classList.add("hidden");
        errorMsg.style.color = "var(--danger)";
        errorMsg.innerText = "Error de conexión al cargar el examen.";
      }
    }

    function renderPreguntas(preguntas) {
      const container = document.getElementById("preguntasContainer");
      container.innerHTML = "";

      preguntas.forEach((p, index) => {
        const box = document.createElement("div");
        box.className = "pregunta-box";

        let opcionesHtml = "";
        for (let key in p.opciones) {
          if (p.opciones[key]) {
            opcionesHtml += `
              <label class="opcion-item">
                <input type="radio" name="p_${index}" value="${key}">
                <strong>${key})</strong> ${p.opciones[key]}
              </label>
            `;
          }
        }

        box.innerHTML = `
          <p style="font-weight:700; color:var(--text-primary); margin-bottom:8px;">${index + 1}. ${p.enunciado}</p>
          ${opcionesHtml}
        `;
        container.appendChild(box);
      });
    }

    async function evaluarRespostas() {
      let correctasCont = 0;

      preguntasExamenActual.forEach((p, index) => {
        const seleccionado = document.querySelector(`input[name="p_${index}"]:checked`);
        if (seleccionado && p.correctas.includes(seleccionado.value)) {
          correctasCont++;
        }
      });

      const totalPreguntas = preguntasExamenActual.length;
      const notaFinal = Math.round((correctasCont / totalPreguntas) * 100);
      const errorMsg = document.getElementById("examenError");
      
      errorMsg.style.color = "var(--primary)";
      errorMsg.innerText = "Guardando resultado...";

      try {
        const res = await pedirJSONP({
          action: "guardarResultado",
          legajo: usuarioActual.legajo,
          nombre: usuarioActual.nombre,
          correo: usuarioActual.correo,
          capacitacion: capacitacionSeleccionada.titulo,
          nota: notaFinal
        });

        if (res.success) {
          alert(`Examen finalizado.\nNota obtenida: ${notaFinal}/100\nEstado: ${res.estado}`);
          location.reload();
        } else {
          errorMsg.style.color = "var(--danger)";
          errorMsg.innerText = res.message || "Error al guardar el resultado.";
        }
      } catch (err) {
        errorMsg.style.color = "var(--danger)";
        errorMsg.innerText = "Error de conexión al guardar el resultado.";
      }
    }
  </script>
</body>
</html>
