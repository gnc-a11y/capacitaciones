<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Capacitaciones</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: #090d16; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.25rem; font-weight: 600; color: var(--text-main); }
    .user-info { font-size: 0.9rem; color: var(--text-sub); }

    .container { flex: 1; max-width: 1000px; width: 100%; margin: 2rem auto; padding: 0 1rem; }
    .hidden { display: none !important; }

    /* LOGIN CARD */
    .login-card { background: var(--card-bg); max-width: 400px; margin: 4rem auto; padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .login-card h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-sub); }
    .form-group input { width: 100%; padding: 0.75rem; background: #090d16; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 1rem; outline: none; }
    .form-group input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 0.75rem; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: var(--danger); font-size: 0.875rem; text-align: center; margin-top: 1rem; }

    /* DASHBOARD */
    .cap-card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .cap-info h3 { margin-bottom: 0.5rem; color: #fff; }
    .cap-info p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .tag { display: inline-block; padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 4px; font-weight: 600; }
    .tag-success { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .tag-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .actions { display: flex; gap: 0.5rem; }

    /* MODAL EXAMEN Y PDF */
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); width: 90%; max-width: 800px; max-height: 90vh; border-radius: 8px; border: 1px solid var(--border); padding: 2rem; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: var(--text-sub); font-size: 1.5rem; cursor: pointer; }
    
    .question-block { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .question-block h4 { margin-bottom: 0.75rem; color: #fff; }
    .option-label { display: block; margin-bottom: 0.5rem; padding: 0.5rem; background: #090d16; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
    .option-label:hover { border-color: var(--accent); }
    .option-label input { margin-right: 0.5rem; }

    iframe { width: 100%; height: 500px; border: none; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>Portal de Capacitaciones</h1>
    <div id="userHeader" class="user-info hidden"></div>
  </header>

  <div class="container">
    <!-- VISTA LOGIN -->
    <div id="loginSection" class="login-card">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm" onsubmit="event.preventDefault(); hacerLogin();">
        <div class="form-group">
          <label>Correo Electrónico:</label>
          <input type="email" id="correo" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label>DNI:</label>
          <input type="text" id="dni" required placeholder="Ingresa tu DNI">
        </div>
        <button type="submit" id="btnLogin" class="btn">Ingresar</button>
        <div id="loginError" class="error-msg hidden"></div>
      </form>
    </div>

    <!-- VISTA DASHBOARD -->
    <div id="dashboardSection" class="hidden">
      <h2 style="margin-bottom: 1.5rem;">Mis Capacitaciones</h2>
      <div id="listaCapacitaciones"></div>
    </div>
  </div>

  <!-- MODAL PDF -->
  <div id="modalPdf" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="cerrarModal('modalPdf')">&times;</button>
      <h3 id="tituloPdf" style="margin-bottom: 1rem;">Material de Capacitación</h3>
      <iframe id="framePdf" src=""></iframe>
    </div>
  </div>

  <!-- MODAL EXAMEN -->
  <div id="modalExamen" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="cerrarModal('modalExamen')">&times;</button>
      <h3 id="tituloExamen" style="margin-bottom: 0.5rem;">Evaluación</h3>
      <p style="color: var(--text-sub); font-size: 0.875rem; margin-bottom: 1.5rem;">Responde todas las preguntas antes de enviar.</p>

      <div id="loaderExamen" style="text-align: center; padding: 2rem;">
        <p>Generando examen dinámico con IA...</p>
      </div>

      <form id="formExamen" class="hidden" onsubmit="event.preventDefault(); evaluarExamen();">
        <div id="preguntasContainer"></div>
        <button type="submit" id="btnEnviarExamen" class="btn">Enviar Examen</button>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN GLOBAL
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDkm0yZXWH8R6bDHeHR6DWe4WmOUixH_okjKncJkh57z3438NSAJgg7RZyG9G-vrcMoA/exec";
    
    let usuarioActual = null;
    let preguntasActuales = [];
    let capacitacionActual = null;

    // ==========================================
    // CLIENTE JSONP (CONEXIÓN SEGURA SIN CORS)
    // ==========================================
    function requestJSONP(url, params, callbackName) {
      return new Promise((resolve, reject) => {
        const name = callbackName || 'jsonp_cb_' + Math.round(100000 * Math.random());
        params.callback = name;

        const queryString = Object.keys(params)
          .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
          .join('&');

        const script = document.createElement('script');
        script.src = url + (url.includes('?') ? '&' : '?') + queryString;

        window[name] = function(data) {
          delete window[name];
          document.body.removeChild(script);
          resolve(data);
        };

        script.onerror = function() {
          delete window[name];
          document.body.removeChild(script);
          reject(new Error("Error de red o conexión al servidor."));
        };

        document.body.appendChild(script);
      });
    }

    // ==========================================
    // INICIO DE SESIÓN
    // ==========================================
    async function hacerLogin() {
      const correo = document.getElementById('correo').value.trim();
      const dni = document.getElementById('dni').value.trim();
      const btn = document.getElementById('btnLogin');
      const errDiv = document.getElementById('loginError');

      btn.disabled = true;
      btn.innerText = "Ingresando...";
      errDiv.classList.add('hidden');

      try {
        const res = await requestJSONP(SCRIPT_URL, { action: 'login', correo: correo, dni: dni });

        if (res.success) {
          usuarioActual = res;
          document.getElementById('userHeader').innerText = `Usuario: ${res.nombre} (Legajo: ${res.legajo})`;
          document.getElementById('userHeader').classList.remove('hidden');
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('dashboardSection').classList.remove('hidden');
          renderCapacitaciones(res.capacitaciones);
        } else {
          errDiv.innerText = res.message;
          errDiv.classList.remove('hidden');
        }
      } catch (err) {
        errDiv.innerText = "Error de conexión. Inténtalo de nuevo.";
        errDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "Ingresar";
      }
    }

    // ==========================================
    // RENDERIZAR DASHBOARD
    // ==========================================
    function renderCapacitaciones(lista) {
      const cont = document.getElementById('listaCapacitaciones');
      cont.innerHTML = "";

      if (!lista || lista.length === 0) {
        cont.innerHTML = "<p>No hay capacitaciones activas.</p>";
        return;
      }

      lista.forEach(cap => {
        const div = document.createElement('div');
        div.className = 'cap-card';

        let tagEstado = '';
        if (cap.aprobado) {
          tagEstado = `<span class="tag tag-success">Aprobado</span>`;
        } else if (cap.bloqueado) {
          tagEstado = `<span class="tag tag-danger">Bloqueado hoy (3 intentos)</span>`;
        } else {
          tagEstado = `<span class="tag" style="background: rgba(255,255,255,0.1);">Intentos hoy: ${cap.intentosHoy}/3</span>`;
        }

        div.innerHTML = `
          <div class="cap-info">
            <h3>${cap.titulo}</h3>
            <p>${cap.descripcion} • Duración: ${cap.duracion}</p>
            ${tagEstado}
          </div>
          <div class="actions">
            <button class="btn" style="background:#475569;" onclick="verPdf('${cap.titulo}', '${cap.urlDrive}')">Ver Material</button>
            ${!cap.aprobado && !cap.bloqueado ? `<button class="btn" onclick="iniciarExamen('${cap.titulo}', '${cap.fileId}')">Rendir Examen</button>` : ''}
          </div>
        `;
        cont.appendChild(div);
      });
    }

    // ==========================================
    // VER MATERIAL (PDF)
    // ==========================================
    function verPdf(titulo, url) {
      document.getElementById('tituloPdf').innerText = titulo;
      document.getElementById('framePdf').src = url;
      document.getElementById('modalPdf').classList.remove('hidden');
    }

    // ==========================================
    // INICIAR Y GENERAR EXAMEN
    // ==========================================
    async function iniciarExamen(titulo, fileId) {
      capacitacionActual = titulo;
      document.getElementById('tituloExamen').innerText = "Evaluación: " + titulo;
      document.getElementById('modalExamen').classList.remove('hidden');
      document.getElementById('loaderExamen').classList.remove('hidden');
      document.getElementById('formExamen').classList.add('hidden');

      try {
        const res = await requestJSONP(SCRIPT_URL, {
          action: 'generarExamen',
          fileId: fileId,
          legajo: usuarioActual.legajo,
          titulo: titulo
        });

        if (res.success && res.preguntas) {
          preguntasActuales = res.preguntas;
          renderPreguntas(res.preguntas);
          document.getElementById('loaderExamen').classList.add('hidden');
          document.getElementById('formExamen').classList.remove('hidden');
        } else {
          alert("No se pudo cargar el examen: " + (res.message || "Error desconocido"));
          cerrarModal('modalExamen');
        }
      } catch (err) {
        alert("Error de comunicación al generar el examen.");
        cerrarModal('modalExamen');
      }
    }

    function renderPreguntas(preguntas) {
      const container = document.getElementById('preguntasContainer');
      container.innerHTML = "";

      preguntas.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = 'question-block';
        
        let opcionesHtml = "";
        for (const [key, val] of Object.entries(p.opciones)) {
          opcionesHtml += `
            <label class="option-label">
              <input type="checkbox" name="p_${index}" value="${key}">
              <strong>${key})</strong> ${val}
            </label>
          `;
        }

        div.innerHTML = `
          <h4>${index + 1}. ${p.enunciado}</h4>
          <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.5rem;">${p.instruccion || 'Seleccione las opciones correctas.'}</p>
          ${opcionesHtml}
        `;
        container.appendChild(div);
      });
    }

    // ==========================================
    // EVALUAR Y GUARDAR RESULTADO
    // ==========================================
    async function evaluarExamen() {
      let correctasContador = 0;

      preguntasActuales.forEach((p, index) => {
        const checkboxes = document.querySelectorAll(`input[name="p_${index}"]:checked`);
        const seleccionadas = Array.from(checkboxes).map(cb => cb.value);

        const correctasEsperadas = p.correctas || [];
        
        // Comprobar si las opciones seleccionadas coinciden exactamente con las correctas
        const esCorrecta = seleccionadas.length === correctasEsperadas.length &&
          seleccionadas.every(val => correctasEsperadas.includes(val));

        if (esCorrecta) {
          correctasContador++;
        }
      });

      const nota = Math.round((correctasContador / preguntasActuales.length) * 100);
      const btn = document.getElementById('btnEnviarExamen');
      btn.disabled = true;
      btn.innerText = "Guardando resultado...";

      try {
        const res = await requestJSONP(SCRIPT_URL, {
          action: 'guardarResultado',
          legajo: usuarioActual.legajo,
          nombre: usuarioActual.nombre,
          capacitacion: capacitacionActual,
          nota: nota
        });

        if (res.success) {
          alert(`Examen finalizado.\nNota obtenida: ${nota}%\nEstado: ${res.estado}`);
          cerrarModal('modalExamen');
          // Recargar dashboard
          hacerLogin();
        } else {
          alert("Error al guardar el resultado: " + res.message);
        }
      } catch (err) {
        alert("Error al enviar las respuestas.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar Examen";
      }
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (id === 'modalPdf') document.getElementById('framePdf').src = "";
    }
  </script>
</body>
</html>
