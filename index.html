<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Capacitaciones CEEZ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b111e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #111a2e;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #3b82f6;
    }

    .user-info {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: #172136;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
      width: 100%;
      max-width: 420px;
    }

    .card-wide {
      max-width: 900px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    input[type="email"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0b111e;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary {
      background-color: #334155;
      margin-bottom: 8px;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
    }

    .cap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .cap-card {
      background-color: #0b111e;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cap-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #f8fafc;
      font-size: 1.1rem;
    }

    .cap-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .badge-approved { background-color: #065f46; color: #34d399; }
    .badge-blocked { background-color: #991b1b; color: #fca5a5; }
    .badge-pending { background-color: #854d0e; color: #fde047; }

    .viewer-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
      background: #000;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .viewer-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .pregunta-box {
      background-color: #0b111e;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .opcion-item {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Capacitaciones CEEZ</div>
    <div class="user-info" id="userInfoHeader"></div>
  </header>

  <main>
    <!-- LOGIN -->
    <div id="loginSection" class="card">
      <h2>Iniciar Sesión</h2>
      <div class="form-group">
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" value="12@gmail.com" placeholder="ejemplo@correo.com">
      </div>
      <div class="form-group">
        <label for="dni">DNI:</label>
        <input type="text" id="dni" value="12123456" placeholder="Ingrese su DNI">
      </div>
      <button class="btn" id="btnLogin" onclick="ejecutarLogin()">Ingresar</button>
      <div class="error-msg" id="loginError"></div>
    </div>

    <!-- LISTA DE CAPACITACIONES -->
    <div id="capacitacionesSection" class="card card-wide hidden">
      <h2>Capacitaciones Disponibles</h2>
      <div class="cap-grid" id="capContainer"></div>
    </div>

    <!-- VISOR (YOUTUBE / DRIVE) -->
    <div id="materialSection" class="card card-wide hidden">
      <h2 id="materialTitulo">Material de Capacitación</h2>
      <div class="viewer-container" id="viewerBox"></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="volverACapacitaciones()">Volver a la Lista</button>
        <button class="btn" onclick="irAExamenDesdeMaterial()">Rendir Examen</button>
      </div>
    </div>

    <!-- EXAMEN -->
    <div id="examenSection" class="card card-wide hidden">
      <h2 id="examenTitulo">Examen</h2>
      <div id="loadingExamen" class="error-msg" style="color:#3b82f6;">Cargando preguntas de la evaluación...</div>
      <div id="preguntasContainer"></div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn btn-secondary" onclick="volverACapacitaciones()">Cancelar</button>
        <button class="btn hidden" id="btnEnviarExamen" onclick="evaluarRespostas()">Enviar Examen</button>
      </div>
      <div class="error-msg" id="examenError"></div>
    </div>
  </main>

  <script>
    const URL_WEB_APP = "[https://script.google.com/macros/s/AKfycbwDkm0yZXWH8R6bDHeHR6DWe4WmOUixH_okjKncJkh57z3438NSAJgg7RZyG9G-vrcMoA/exec](https://script.google.com/macros/s/AKfycbwDkm0yZXWH8R6bDHeHR6DWe4WmOUixH_okjKncJkh57z3438NSAJgg7RZyG9G-vrcMoA/exec)";

    let usuarioActual = { legajo: "", nombre: "" };
    let capacitacionSeleccionada = null;
    let preguntasExamenActual = [];

    // Función JSONP Dinámica y segura
    function pedirJSONP(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const script = document.createElement('script');
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          resolve(data);
        };

        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject(new Error("Error de conexión al servidor."));
        };

        const queryParams = new URLSearchParams(params);
        queryParams.append('callback', callbackName);

        script.src = `${URL_WEB_APP}?${queryParams.toString()}`;
        document.body.appendChild(script);
      });
    }

    async function ejecutarLogin() {
      const correo = document.getElementById("correo").value.trim();
      const dni = document.getElementById("dni").value.trim();
      const msgError = document.getElementById("loginError");
      const btn = document.getElementById("btnLogin");

      if (!correo || !dni) {
        msgError.innerText = "Por favor ingresa correo y DNI.";
        return;
      }

      msgError.style.color = "#3b82f6";
      msgError.innerText = "Verificando credenciales...";
      btn.disabled = true;

      try {
        const res = await pedirJSONP({
          action: "login",
          correo: correo,
          dni: dni
        });

        if (res.success) {
          usuarioActual.legajo = res.legajo;
          usuarioActual.nombre = res.nombre;
          
          document.getElementById("userInfoHeader").innerText = `${res.nombre} (Legajo: ${res.legajo})`;
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("capacitacionesSection").classList.remove("hidden");
          
          renderCapacitaciones(res.capacitaciones);
        } else {
          msgError.style.color = "#ef4444";
          msgError.innerText = res.message || "Credenciales incorrectas.";
        }
      } catch (err) {
        msgError.style.color = "#ef4444";
        msgError.innerText = "Error de conexión. Inténtalo de nuevo.";
      } finally {
        btn.disabled = false;
      }
    }

    function renderCapacitaciones(capacitaciones) {
      const container = document.getElementById("capContainer");
      container.innerHTML = "";

      if (!capacitaciones || capacitaciones.length === 0) {
        container.innerHTML = "<p>No hay capacitaciones activas asignadas.</p>";
        return;
      }

      capacitaciones.forEach(cap => {
        let badgeHtml = "";
        let btnDisabled = "";

        if (cap.aprobado) {
          badgeHtml = `<span class="badge badge-approved">Aprobado</span>`;
        } else if (cap.bloqueado) {
          badgeHtml = `<span class="badge badge-blocked">Límite alcanzado hoy (3/3)</span>`;
          btnDisabled = "disabled";
        } else {
          badgeHtml = `<span class="badge badge-pending">Intentos hoy: ${cap.intentosHoy}/3</span>`;
        }

        const card = document.createElement("div");
        card.className = "cap-card";
        card.innerHTML = `
          <div>
            <div class="cap-title">${cap.titulo}</div>
            <div class="cap-desc">${cap.descripcion}</div>
            ${badgeHtml}
          </div>
          <div>
            <button class="btn btn-secondary" onclick="verMaterial('${cap.fileId}', '${encodeURIComponent(cap.titulo)}', '${encodeURIComponent(cap.urlDrive)}')">
              Ver Contenido
            </button>
            <button class="btn" ${btnDisabled} onclick="iniciarExamen('${cap.fileId}', '${encodeURIComponent(cap.titulo)}')">
              ${cap.aprobado ? "Rendir Nuevamente" : "Rendir Examen"}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function obtenerUrlEmbed(url) {
      if (!url) return "";
      let youtubeMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (youtubeMatch && youtubeMatch[1]) {
        return `[https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){youtubeMatch[1]}?autoplay=1`;
      }
      return url;
    }

    function verMaterial(fileId, tituloEncoded, urlDriveEncoded) {
      const titulo = decodeURIComponent(tituloEncoded);
      const urlDrive = decodeURIComponent(urlDriveEncoded);
      
      capacitacionSeleccionada = { fileId, titulo };

      document.getElementById("capacitacionesSection").classList.add("hidden");
      document.getElementById("materialSection").classList.remove("hidden");
      document.getElementById("materialTitulo").innerText = titulo;

      const embedUrl = obtenerUrlEmbed(urlDrive);
      document.getElementById("viewerBox").innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay"></iframe>`;
    }

    function irAExamenDesdeMaterial() {
      document.getElementById("materialSection").classList.add("hidden");
      iniciarExamen(capacitacionSeleccionada.fileId, encodeURIComponent(capacitacionSeleccionada.titulo));
    }

    function volverACapacitaciones() {
      document.getElementById("materialSection").classList.add("hidden");
      document.getElementById("examenSection").classList.add("hidden");
      document.getElementById("capacitacionesSection").classList.remove("hidden");
      document.getElementById("viewerBox").innerHTML = "";
    }

    async function iniciarExamen(fileId, tituloEncoded) {
      const titulo = decodeURIComponent(tituloEncoded);
      capacitacionSeleccionada = { fileId, titulo };

      document.getElementById("capacitacionesSection").classList.add("hidden");
      document.getElementById("examenSection").classList.remove("hidden");
      document.getElementById("examenTitulo").innerText = "Evaluación: " + titulo;
      
      const loading = document.getElementById("loadingExamen");
      const preguntasBox = document.getElementById("preguntasContainer");
      const btnEnviar = document.getElementById("btnEnviarExamen");
      const errorMsg = document.getElementById("examenError");

      loading.classList.remove("hidden");
      preguntasBox.innerHTML = "";
      btnEnviar.classList.add("hidden");
      errorMsg.innerText = "";

      try {
        const res = await pedirJSONP({
          action: "generarExamen",
          fileId: fileId,
          legajo: usuarioActual.legajo,
          titulo: titulo
        });

        if (res.success && res.preguntas) {
          preguntasExamenActual = res.preguntas;
          loading.classList.add("hidden");
          renderPreguntas(res.preguntas);
          btnEnviar.classList.remove("hidden");
        } else {
          loading.classList.add("hidden");
          errorMsg.innerText = res.message || "Error al obtener preguntas.";
        }
      } catch (err) {
        loading.classList.add("hidden");
        errorMsg.innerText = "Error de conexión al cargar el examen.";
      }
    }

    function renderPreguntas(preguntas) {
      const container = document.getElementById("preguntasContainer");
      container.innerHTML = "";

      preguntas.forEach((p, index) => {
        const box = document.createElement("div");
        box.className = "pregunta-box";

        const esDoble = Array.isArray(p.correctas) && p.correctas.length > 1;
        const inputType = esDoble ? "checkbox" : "radio";
        const subtexto = esDoble 
          ? "Seleccione las 2 opciones correctas (10 pts c/u)." 
          : "Seleccione la opción correcta (12 pts).";

        let opcionesHtml = "";
        for (let key in p.opciones) {
          opcionesHtml += `
            <label class="opcion-item">
              <input type="${inputType}" name="p_${index}" value="${key}">
              <strong>${key})</strong> ${p.opciones[key]}
            </label>
          `;
        }

        box.innerHTML = `
          <p style="font-weight:bold; margin-bottom:4px;">${index + 1}. ${p.enunciado}</p>
          <p style="font-size:0.8rem; color:#3b82f6; margin-bottom:12px;">${subtexto}</p>
          ${opcionesHtml}
        `;
        container.appendChild(box);
      });
    }

    async function evaluarRespostas() {
      let puntajeTotal = 0;

      preguntasExamenActual.forEach((p, index) => {
        const esDoble = Array.isArray(p.correctas) && p.correctas.length > 1;

        if (esDoble) {
          const marcados = Array.from(document.querySelectorAll(`input[name="p_${index}"]:checked`))
                                .map(el => el.value);
          
          p.correctas.forEach(cor => {
            if (marcados.includes(cor)) {
              puntajeTotal += 10;
            }
          });
        } else {
          const seleccionado = document.querySelector(`input[name="p_${index}"]:checked`);
          if (seleccionado && p.correctas.includes(seleccionado.value)) {
            puntajeTotal += 12;
          }
        }
      });

      const notaFinal = Math.min(100, puntajeTotal);
      const errorMsg = document.getElementById("examenError");
      errorMsg.style.color = "#3b82f6";
      errorMsg.innerText = "Guardando resultado...";

      try {
        const res = await pedirJSONP({
          action: "guardarResultado",
          legajo: usuarioActual.legajo,
          nombre: usuarioActual.nombre,
          capacitacion: capacitacionSeleccionada.titulo,
          nota: notaFinal
        });

        if (res.success) {
          alert(`Examen finalizado.\nPuntaje obtenido: ${notaFinal}/100\nEstado: ${res.estado}`);
          location.reload();
        } else {
          errorMsg.style.color = "#ef4444";
          errorMsg.innerText = res.message || "Error al guardar el resultado.";
        }
      } catch (err) {
        errorMsg.style.color = "#ef4444";
        errorMsg.innerText = "Error de conexión al guardar resultado.";
      }
    }
  </script>
</body>
</html>
