<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Capacitaciones S&H</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-custom {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      background: #ffffff;
    }
    .card-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .badge-status {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .badge-aprobado {
      background-color: #d1fae5;
      color: #065f46;
    }
    .badge-intentos {
      background-color: #fef3c7;
      color: #92400e;
    }
    .badge-bloqueado {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .modal-header {
      background-color: #1e3a8a;
      color: white;
    }
    .btn-close-white {
      filter: invert(1);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-bar shadow-sm">
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary fs-6">CEEZ</span>
      <h5 class="m-0 fw-bold text-dark">Portal de Capacitaciones</h5>
    </div>
    <div id="usuarioInfo" class="text-muted fw-semibold small"></div>
  </div>

  <div class="container my-5">

    <!-- Vista Login -->
    <div id="vistaLogin" class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-custom p-4">
          <h4 class="text-center fw-bold mb-4 text-primary">Ingreso al Portal</h4>
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label fw-semibold">Correo Electrónico</label>
              <input type="email" id="loginCorreo" class="form-control" placeholder="ejemplo@ceez.coop" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Número de DNI</label>
              <input type="number" id="loginDni" class="form-control" placeholder="Ingrese su DNI" required>
            </div>
            <button type="submit" id="btnIngresar" class="btn btn-primary w-100 fw-bold py-2">Ingresar</button>
          </form>
          <div id="loginError" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
      </div>
    </div>

    <!-- Vista Capacitaciones -->
    <div id="vistaCapacitaciones" class="d-none">
      <h3 class="text-center fw-bold mb-4 text-dark">Capacitaciones Disponibles</h3>
      <div id="listaCapacitaciones" class="row g-4 justify-content-center"></div>
    </div>

  </div>

  <!-- Modal Contenido -->
  <div class="modal fade" id="modalContenido" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloContenido">Material de Capacitación</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center p-4">
          <p class="text-muted mb-4">Asegúrese de revisar todo el material atentamente antes de rendir la evaluación.</p>
          <a id="btnLinkDrive" href="#" target="_blank" class="btn btn-outline-primary btn-lg fw-bold">
            📁 Abrir Material en Google Drive
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Examen -->
  <div class="modal fade" id="modalExamen" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="tituloExamen">Evaluación</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="cuerpoExamen">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando preguntas...</p>
          </div>
        </div>
        <div class="modal-footer" id="footerExamen">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnEnviarExamen" class="btn btn-success fw-bold" onclick="evaluarExamen()">Enviar Evaluación</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL del Web App de Apps Script (Asegúrate de colocar tu URL pública aquí)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwO4rEexO8o4mKjC4I1vO-_T27o84RzT99N1V8N-P3N19K5C5P3N19/exec"; // Reemplaza por tu URL ejecutoria

    let usuarioActual = null;
    let preguntasActuales = [];
    let capacitacionActual = null;

    // Petición JSONP para evitar bloqueos por CORS
    function callGAS(params, callback) {
      const callbackName = 'gas_cb_' + Math.floor(Math.random() * 1000000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);
        callback(data);
      };

      params.callback = callbackName;
      const query = Object.keys(params)
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
        .join('&');

      const script = document.createElement('script');
      script.src = SCRIPT_URL + '?' + query;
      document.body.appendChild(script);
    }

    // Login
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      const correo = document.getElementById('loginCorreo').value.trim();
      const dni = document.getElementById('loginDni').value.trim();
      const btn = document.getElementById('btnIngresar');
      const errDiv = document.getElementById('loginError');

      btn.disabled = true;
      btn.innerText = "Verificando...";
      errDiv.classList.add('d-none');

      callGAS({ action: 'login', correo: correo, dni: dni }, function(res) {
        btn.disabled = false;
        btn.innerText = "Ingresar";

        if (res.success) {
          usuarioActual = res;
          document.getElementById('usuarioInfo').innerText = `${res.nombre} (Legajo: ${res.legajo})`;
          document.getElementById('vistaLogin').classList.add('d-none');
          document.getElementById('vistaCapacitaciones').classList.remove('d-none');
          renderCapacitaciones(res.capacitaciones);
        } else {
          errDiv.innerText = res.message || "Credenciales inválidas.";
          errDiv.classList.remove('d-none');
        }
      });
    });

    // Renderizar Capacitaciones
    function renderCapacitaciones(lista) {
      const cont = document.getElementById('listaCapacitaciones');
      cont.innerHTML = '';

      lista.forEach(cap => {
        let badgeEstado = '';
        let botonExamen = '';

        if (cap.aprobado) {
          badgeEstado = `<span class="badge badge-status badge-aprobado">✓ Aprobado</span>`;
          botonExamen = `
            <button class="btn btn-outline-primary w-100 mb-2" onclick="iniciarExamen('${cap.titulo}')">Rendir Nuevamente</button>
          `;
          if (cap.urlCertificado) {
            botonExamen += `
              <a href="${cap.urlCertificado}" target="_blank" class="btn btn-success w-100 fw-bold">
                📄 Ver / Descargar Certificado
              </a>`;
          }
        } else if (cap.bloqueado) {
          badgeEstado = `<span class="badge badge-status badge-bloqueado">Límite de 3 intentos alcanzado hoy</span>`;
          botonExamen = `<button class="btn btn-secondary w-100" disabled>Bloqueado por hoy</button>`;
        } else {
          badgeEstado = `<span class="badge badge-status badge-intentos">Intentos hoy: ${cap.intentosHoy}/3</span>`;
          botonExamen = `<button class="btn btn-primary w-100" onclick="iniciarExamen('${cap.titulo}')">Rendir Examen</button>`;
        }

        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-5';
        col.innerHTML = `
          <div class="card card-custom h-100 p-4 d-flex flex-column justify-content-between">
            <div>
              <h5 class="fw-bold text-dark mb-2">${cap.titulo}</h5>
              <p class="text-muted small mb-3">${cap.descripcion}</p>
              <div class="mb-3">${badgeEstado}</div>
            </div>
            <div>
              <button class="btn btn-outline-secondary w-100 mb-2" onclick="verContenido('${cap.titulo}', '${cap.urlDrive}')">Ver Contenido</button>
              ${botonExamen}
            </div>
          </div>
        `;
        cont.appendChild(col);
      });
    }

    // Modal Contenido
    function verContenido(titulo, url) {
      document.getElementById('tituloContenido').innerText = titulo;
      document.getElementById('btnLinkDrive').href = url;
      new bootstrap.Modal(document.getElementById('modalContenido')).show();
    }

    // Modal Examen
    function iniciarExamen(titulo) {
      capacitacionActual = titulo;
      document.getElementById('tituloExamen').innerText = "Evaluación: " + titulo;
      document.getElementById('cuerpoExamen').innerHTML = `
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">Generando examen aleatorio...</p>
        </div>`;
      document.getElementById('footerExamen').classList.remove('d-none');

      const modalExamen = new bootstrap.Modal(document.getElementById('modalExamen'));
      modalExamen.show();

      callGAS({ action: 'generarExamen', titulo: titulo }, function(res) {
        if (res.success) {
          preguntasActuales = res.preguntas;
          renderPreguntas(res.preguntas);
        } else {
          document.getElementById('cuerpoExamen').innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
          document.getElementById('footerExamen').classList.add('d-none');
        }
      });
    }

    // Renderizar Preguntas
    function renderPreguntas(preguntas) {
      let html = '';
      preguntas.forEach((p, idx) => {
        html += `
          <div class="mb-4 p-3 border rounded bg-light">
            <p class="fw-bold mb-2">${idx + 1}. ${p.enunciado}</p>`;
        
        Object.keys(p.opciones).forEach(key => {
          const isMultiple = p.correctas.length > 1;
          const inputType = isMultiple ? 'checkbox' : 'radio';
          const inputName = isMultiple ? `p_${idx}_${key}` : `p_${idx}`;

          html += `
            <div class="form-check my-1">
              <input class="form-check-input" type="${inputType}" name="${inputName}" value="${key}" id="p_${idx}_${key}">
              <label class="form-check-label" for="p_${idx}_${key}">
                ${p.opciones[key]}
              </label>
            </div>`;
        });

        html += `</div>`;
      });

      document.getElementById('cuerpoExamen').innerHTML = html;
    }

    // Evaluar y Guardar Resultado
    function evaluarExamen() {
      let correctasContador = 0;

      preguntasActuales.forEach((p, idx) => {
        const isMultiple = p.correctas.length > 1;
        let seleccionadas = [];

        if (isMultiple) {
          Object.keys(p.opciones).forEach(key => {
            const input = document.getElementById(`p_${idx}_${key}`);
            if (input && input.checked) seleccionadas.push(key);
          });
        } else {
          const checked = document.querySelector(`input[name="p_${idx}"]:checked`);
          if (checked) seleccionadas.push(checked.value);
        }

        // Comparación de respuestas
        seleccionadas.sort();
        const correctas = [...p.correctas].sort();
        if (JSON.stringify(seleccionadas) === JSON.stringify(correctas)) {
          correctasContador++;
        }
      });

      // Cálculo de Nota sobre 100%
      const nota = Math.round((correctasContador / preguntasActuales.length) * 100);

      document.getElementById('cuerpoExamen').innerHTML = `
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">Procesando y guardando calificación...</p>
        </div>`;
      document.getElementById('footerExamen').classList.add('d-none');

      callGAS({
        action: 'guardarResultado',
        legajo: usuarioActual.legajo,
        nombre: usuarioActual.nombre,
        capacitacion: capacitacionActual,
        nota: nota
      }, function(res) {
        if (res.success) {
          const aprobado = res.estado === "Aprobado";
          let alertClass = aprobado ? "alert-success" : "alert-danger";
          let tituloRes = aprobado ? "¡Felicitaciones! Has Aprobado" : "Evaluación Desaprobada";
          
          let htmlRes = `
            <div class="alert ${alertClass} text-center p-4">
              <h4>${tituloRes}</h4>
              <p class="fs-5 my-2">Tu nota fue: <strong>${nota}%</strong> (Mínimo requerido: 60%)</p>`;

          if (aprobado && res.urlCertificado) {
            htmlRes += `
              <div class="mt-4">
                <a href="${res.urlCertificado}" target="_blank" class="btn btn-success btn-lg fw-bold">
                  🎓 Abrir / Descargar Certificado (PDF)
                </a>
              </div>`;
          }

          htmlRes += `</div>`;
          document.getElementById('cuerpoExamen').innerHTML = htmlRes;

          // Recargar capacitaciones para refrescar botones e intentos
          callGAS({ action: 'login', correo: usuarioActual.correo, dni: usuarioActual.dni }, function(refreshRes) {
            if (refreshRes.success) {
              renderCapacitaciones(refreshRes.capacitaciones);
            }
          });

        } else {
          document.getElementById('cuerpoExamen').innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
        }
      });
    }
  </script>
</body>
</html>
